[project]
name = "cse-orchestrator"
version = "0.1.0"
description = "Cinematic Singularity Engine (CSE) Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "alembic>=1.13.1",
  "boto3>=1.34.0",
  "python-multipart>=0.0.9",
  "temporalio>=1.6.0",
  "tenacity>=8.3.0",
  "orjson>=3.10.0",
  "httpx>=0.27.0",
  "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "types-boto3>=1.0.2",
  "types-requests>=2.32.0.20240622",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["src"]
lint.select = ["E", "F", "I", "B", "UP", "SIM"]
lint.ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
